# ============================================
# TruXpert - Example Configuration
# ============================================
# Copy this file to application.properties for local development
# In production, use environment variables instead

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/foodtruck?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:your_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.generate-ddl=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Server Configuration (Render uses PORT env variable)
server.port=${PORT:8080}

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.packagesToScan=com.examly.springapp.controller
springdoc.pathsToMatch=/api/**
springdoc.show-actuator=false
spring.data.rest.detection-strategy=annotated

# Application Security
# IMPORTANT: Change this to a strong password in production!
app.seed.password=${SEED_PASSWORD:changeme}
